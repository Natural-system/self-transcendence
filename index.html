---
layout: default
title: 首页
---

<div class="home-posts">
  <ul class="post-list">
    {% for post in site.posts %}
      <li class="post-item">
        <div class="post-left">
          <span class="post-index">{{ forloop.rindex | prepend: '00' | slice: -2, 2 }}</span>
          <a class="post-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </div>
        <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
