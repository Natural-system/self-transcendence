# ============================================
# 分页配置 (jekyll-paginate-v2)
# ============================================
pagination:
  enabled: true
  per_page: 30
  permalink: '/page/:num/'
  title_suffix: ' - 第 :num 页'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

# 自动分页：为每个分类生成独立分页
autopages:
  enabled: true
  categories:
    enabled: true
    layouts:
      - 'category.html'
    title: ':cat 分类'
    permalink: '/categories/:cat/'
    slugify:
      mode: 'default'
      cased: true