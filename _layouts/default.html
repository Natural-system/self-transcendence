<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  
  <style>
    :root {
      --bg-color: #fbfbf9;
      --text-color: #2b2b2b;
      --muted-color: #8c8c8c;
      --border-color: #eaeaea;
      --accent-color: #000000;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      line-height: 1.8;
      margin: 0;
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    /* 顶部阅读进度条 */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      z-index: 9999;
    }
    .progress-bar {
      height: 3px;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.1s ease-out;
    }

    /* 主容器 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* 顶部页眉与导航 */
    header {
      margin-bottom: 50px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    .site-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    .site-description {
      font-size: 0.9rem;
      color: var(--muted-color);
      margin-bottom: 20px;
    }

    /* 顶部导航栏（已修复 hover 抖动问题） */
    nav.site-nav {
      display: flex;
      flex-wrap: wrap;       /* 手机端自动顺畅换行 */
      gap: 16px 28px;        /* 上下间距 16px，左右分类间距 28px */
      align-items: center;
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 15px;
    }

    nav.site-nav a {
      padding: 2px 0;
      color: var(--text-color);
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 2px solid transparent; /* 预先占用 2px 空间，防止 hover 时撑高页面导致抖动 */
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    nav.site-nav a:hover {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color); /* 仅改变下划线颜色，不改变高度 */
      text-decoration: none; /* 禁用默认文本下划线，使用自定义的 border 下划线 */
    }

    /* 首页纯标题列表排版 */
    .post-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .post-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .post-left {
      display: flex;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding-right: 20px;
    }

    .post-index {
      font-family: var(--font-mono);
      color: var(--muted-color);
      font-size: 0.9rem;
      min-width: 28px;
    }

    .post-title {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .post-date {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--muted-color);
      white-space: nowrap;
    }

    /* 双栏文章布局 (左侧目录，右侧正文) */
    .layout-grid {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 50px;
      align-items: start;
    }

    @media (max-width: 850px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
      .sidebar-toc {
        display: none; /* 移动端暂隐悬浮目录，保证正文可读性 */
      }
    }

    .sidebar-toc {
      position: sticky;
      top: 40px;
      background: #f4f4f0;
      padding: 18px;
      border-radius: 4px;
      font-size: 0.85rem;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
    }

    .toc-title {
      font-weight: 700;
      color: var(--muted-color);
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-color);
    }

    .toc-content ul {
      padding-left: 15px;
      margin: 5px 0;
    }

    .article-header {
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    .article-title {
      font-size: 1.8rem;
      line-height: 1.3;
      margin: 0 0 10px 0;
    }

    .meta-info {
      font-size: 0.85rem;
      color: var(--muted-color);
      font-family: var(--font-mono);
    }

    footer {
      margin-top: 80px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--muted-color);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 顶部阅读进度条 -->
  <div class="progress-container">
    <div class="progress-bar" id="myProgressBar"></div>
  </div>

  <div class="container">
    <header>
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <div class="site-description">{{ site.description }}</div>
      
      <!-- 平铺导航栏 -->
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">首页</a>
        
        <!-- 平铺的具体分类 -->
        <a href="{{ '/categories/#心理&社会' | relative_url }}">心理&社会</a>
        <a href="{{ '/categories/#生活' | relative_url }}">生活</a>
        <a href="{{ '/categories/#育儿' | relative_url }}">育儿</a>
        <a href="{{ '/categories/#代码' | relative_url }}">代码</a>
        <a href="{{ '/categories/#户外' | relative_url }}">户外</a>
        <a href="{{ '/categories/#其他' | relative_url }}">其他</a>
        
        <a href="{{ '/archive.md' | relative_url }}">年份归档</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      &copy; {{ 'now' | date: "%Y" }} {{ site.title }} · Powered by Jekyll & GitHub Pages
    </footer>
  </div>

  <script>
    // 顶部阅读进度条逻辑
    window.onscroll = function() {
      var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var scrolled = (winScroll / height) * 100;
      var pb = document.getElementById("myProgressBar");
      if(pb) pb.style.width = scrolled + "%";
    };
  </script>
</body>
</html>
