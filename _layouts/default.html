<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- SEO 描述与关键词 -->
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 150 | default: site.description }}">
  
  <!-- Open Graph 标签（社交平台分享卡片） -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 150 | default: site.description }}">
  <meta property="og:type" content="{% if page.title %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <!-- 规范链接 -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- 1. 防闪烁脚本：优先读取本地主题配置并应用到 <html> 标签 -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    /* ========================================== */
    /* --- 1. 全局 CSS 变量与主题配置 --- */
    /* ========================================== */
    :root, html[data-theme="light"] {
      --bg-color: #fbfbf9;
      --text-color: #2b2b2b;
      --muted-color: #8c8c8c;
      --border-color: #eaeaea;
      --accent-color: #000000;
      --code-bg: #1e1e1e;
      --code-border: transparent;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Fira Code", "Liberation Mono", Menlo, monospace;
    }

    /* 暖黄 / 羊皮纸模式 */
    html[data-theme="warm"] {
      --bg-color: #fbf0d9;
      --text-color: #3f3935;
      --muted-color: #8c8275;
      --border-color: #e4d8c1;
      --accent-color: #2b2521;
      --code-bg: #1e1e1e;
      --code-border: transparent;
    }

    /* 护眼绿模式 */
    html[data-theme="green"] {
      --bg-color: #c7edcc;
      --text-color: #233329;
      --muted-color: #6b8273;
      --border-color: #b3dfb9;
      --accent-color: #111c15;
      --code-bg: #1e1e1e;
      --code-border: transparent;
    }

    /* 暗黑模式 */
    html[data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --muted-color: #888888;
      --border-color: #2a2a2a;
      --accent-color: #ffffff;
      --code-bg: #1e1e1e;
      --code-border: #333333;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      line-height: 1.8;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    /* ========================================== */
    /* --- 2. 通用深色代码块样式 --- */
    /* ========================================== */
    .highlight, 
    figure.highlight, 
    div.highlighter-rouge, 
    .highlighter-rouge div.highlight {
      position: relative !important;
      max-width: 100% !important;
      min-width: 0 !important;
      overflow-x: auto !important;
      margin: 1.5em 0;
      border-radius: 8px;
    }

    pre {
      position: relative !important;
      background-color: var(--code-bg) !important;
      border: 1px solid var(--code-border);
      color: #9cdcfe !important;
      padding: 16px 18px 14px 18px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
      max-width: 100% !important;
      min-width: 0 !important;
      overflow-x: auto !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    pre code {
      background-color: transparent !important;
      color: inherit !important;
      padding: 0;
      white-space: pre !important;
      word-break: normal !important;
      display: block;
    }

    p code, li code {
      background-color: rgba(0, 0, 0, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.9em;
      word-break: break-word;
    }

    html[data-theme="dark"] p code, 
    html[data-theme="dark"] li code {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* 代码块右上角一键复制按钮样式 */
    .copy-code-button {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.15);
      color: #d4d4d4;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      user-select: none;
    }

    .highlight:hover .copy-code-button,
    pre:hover .copy-code-button {
      opacity: 1;
    }

    .copy-code-button:hover {
      background-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    .copy-code-button.copied {
      background-color: #28a745 !important;
      color: #ffffff !important;
      border-color: #28a745 !important;
    }

    /* 限制文章正文防撑爆保底 */
    main, article, .post-content {
      max-width: 100%;
      min-width: 0;
      word-wrap: break-word;
      word-break: break-word;
    }

    main img, article img {
      max-width: 100%;
      height: auto;
    }

    /* 文章正文表格样式 */
    main table, article table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
      font-size: 0.95rem;
    }

    main th, article th,
    main td, article td {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    main th, article th {
      background-color: rgba(0, 0, 0, 0.03);
      font-weight: 600;
    }

    main tr:nth-child(even), article tr:nth-child(even) {
      background-color: rgba(0, 0, 0, 0.015);
    }

    /* ========================================== */
    /* --- 2.1 全局文章引用块 (blockquote) 样式 --- */
    /* ========================================== */
    main blockquote, article blockquote, .post-content blockquote {
      margin: 1.5em 0;
      padding: 10px 16px;
      background-color: rgba(0, 0, 0, 0.03);
      border-left: 4px solid var(--accent-color);
      color: var(--muted-color);
      border-radius: 0 4px 4px 0;
    }

    main blockquote p, article blockquote p, .post-content blockquote p {
      margin: 0 0 8px 0;
      line-height: 1.65;
    }

    main blockquote p:last-child, article blockquote p:last-child {
      margin-bottom: 0;
    }

    /* ========================================== */
    /* --- 3. 页面基础布局样式与主题切换器 UI --- */
    /* ========================================== */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      z-index: 9998;
    }
    .progress-bar {
      height: 3px;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.1s ease-out;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    header {
      position: relative;
      z-index: 100;
      margin-bottom: 50px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    .site-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    .site-description {
      font-size: 0.9rem;
      color: var(--muted-color);
      margin-bottom: 20px;
    }

    nav.site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 20px;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 15px;
    }

    nav.site-nav a {
      padding: 2px 0;
      color: var(--text-color);
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    nav.site-nav a:hover {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color);
      text-decoration: none;
    }

    .nav-search-input {
      width: 120px;
      padding: 4px 10px;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s ease, width 0.2s ease;
    }
    .nav-search-input:focus {
      border-color: var(--accent-color);
      width: 150px;
    }

    /* --- 主题切换色彩小圆点组件 --- */
    .theme-switcher {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
      padding-left: 8px;
      border-left: 1px solid var(--border-color);
      position: relative;
      z-index: 99;
    }

    .theme-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: 1.5px solid rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      display: inline-block;
      pointer-events: auto;
    }

    .theme-dot:hover {
      transform: scale(1.25);
    }

    .theme-dot.active {
      box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--accent-color);
    }

    .theme-dot[data-set-theme="light"] { background-color: #fbfbf9; }
    .theme-dot[data-set-theme="warm"]  { background-color: #fbf0d9; }
    .theme-dot[data-set-theme="green"] { background-color: #c7edcc; }
    .theme-dot[data-set-theme="dark"]  { background-color: #121212; border-color: rgba(255, 255, 255, 0.3); }

    .post-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .post-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .post-left {
      display: flex;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding-right: 20px;
    }

    .post-index {
      font-family: var(--font-mono);
      color: var(--muted-color);
      font-size: 0.85rem;
      min-width: 32px;
    }

    .post-title {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .post-date {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--muted-color);
      white-space: nowrap;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 50px;
      align-items: start;
    }

    @media (max-width: 850px) {
      .layout-grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .sidebar-toc {
        display: none;
      }
    }

    .sidebar-toc {
      position: sticky;
      top: 40px;
      background: rgba(0, 0, 0, 0.03);
      padding: 18px;
      border-radius: 4px;
      font-size: 0.85rem;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
    }

    .toc-title {
      font-weight: 700;
      color: var(--muted-color);
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-color);
    }

    .toc-content ul {
      padding-left: 15px;
      margin: 5px 0;
    }

    .article-header {
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    .article-title {
      font-size: 1.8rem;
      line-height: 1.3;
      margin: 0 0 10px 0;
    }

    .meta-info {
      font-size: 0.85rem;
      color: var(--muted-color);
      font-family: var(--font-mono);
    }

    footer {
      margin-top: 80px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--muted-color);
      text-align: center;
    }

    /* ========================================== */
    /* --- 4. 彻底脱离文档流的全局搜索弹窗样式 --- */
    /* ========================================== */
    #search-modal-overlay {
      display: none;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(0, 0, 0, 0.5) !important;
      z-index: 9999 !important; /* 最高层级，彻底隔离原网页 */
      backdrop-filter: blur(4px);
      box-sizing: border-box;
    }

    .search-modal-content {
      position: relative;
      max-width: 680px;
      width: 90%;
      margin: 100px auto 0;
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-height: 70vh;
      overflow-y: auto;
      box-sizing: border-box;
    }

    @media (max-width: 600px) {
      .search-modal-content {
        margin: 50px auto 0;
        width: 95%;
        padding: 16px;
      }
    }


/* 确保分页容器 flex 布局并居中 */
.pagination {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  flex-wrap: wrap; /* 防止小屏拉伸 */
  gap: 8px !important; /* 关键：强制拉开数字、按钮、输入框之间的间距 */
  margin: 25px 0 !important;
}

/* 统一页码与按钮样式 */
.pagination a,
.pagination span,
.pagination button {
  display: inline-block;
  padding: 4px 10px;
  border: 1px solid #d0d7de;
  border-radius: 4px;
  text-decoration: none;
  color: #333;
  font-size: 14px;
}

/* 页码输入框样式 */
.pagination input[type="text"],
.pagination input[type="number"] {
  width: 45px;
  height: 28px;
  padding: 2px 5px;
  text-align: center;
  border: 1px solid #ccc;
  border-radius: 4px;
  margin: 0 4px;
}

  </style>
</head>
<body>

  <!-- 顶部阅读进度条 -->
  <div class="progress-container">
    <div class="progress-bar" id="myProgressBar"></div>
  </div>

  <div class="container">
    <header>
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <div class="site-description">{{ site.description }}</div>
      
      <!-- 平铺导航栏 -->
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/categories/#心理与社会' | relative_url }}">心理与社会</a>
        <a href="{{ '/categories/#生活' | relative_url }}">生活</a>
        <a href="{{ '/categories/#育儿' | relative_url }}">育儿</a>
        <a href="{{ '/categories/#软件' | relative_url }}">软件</a>
        <a href="{{ '/categories/#户外' | relative_url }}">户外</a>
        <a href="{{ '/categories/#其他' | relative_url }}">其他</a>
        <a href="{{ '/archive/' | relative_url }}">年份归档</a>
        <a href="{{ '/log/' | relative_url }}">日志</a> 
        <a href="{{ '/about/' | relative_url }}">关于</a>

        <!-- 页头极简搜索框 -->
        <div style="display: inline-flex; align-items: center; margin-left: 4px;">
          <input type="text" id="global-search-input" class="nav-search-input" placeholder="搜索关键词..." oninput="handleGlobalSearch()">
        </div>

        <!-- 主题颜色切换器 -->
        <div class="theme-switcher">
          <span class="theme-dot" data-set-theme="light" title="日光模式" onclick="changeTheme('light')"></span>
          <span class="theme-dot" data-set-theme="warm" title="羊皮纸模式" onclick="changeTheme('warm')"></span>
          <span class="theme-dot" data-set-theme="green" title="护眼绿模式" onclick="changeTheme('green')"></span>
          <span class="theme-dot" data-set-theme="dark" title="暗黑模式" onclick="changeTheme('dark')"></span>
        </div>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      &copy; {{ 'now' | date: "%Y" }} {{ site.title }} · Powered by Jekyll & GitHub Pages
    </footer>
  </div>

  <!-- 全局搜索弹窗组件（脱离普通文档流） -->
  <div id="search-modal-overlay" onclick="closeSearchModal(event)">
    <div class="search-modal-content" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 15px;">
        <h3 style="margin:0; font-size: 1.1rem; color:var(--text-color);">搜索结果</h3>
        <span onclick="closeSearchModalDirect()" style="cursor:pointer; font-size: 1.5rem; color:var(--muted-color); line-height: 1;">&times;</span>
      </div>
      <ul id="search-results-list" class="post-list"></ul>
      <div id="search-no-results" style="display:none; color:var(--muted-color); font-size:0.9rem; padding: 15px 0;">未找到相关文章</div>
    </div>
  </div>

  <script>
    // 0. 主题切换与持久化逻辑
    function changeTheme(targetTheme) {
      document.documentElement.setAttribute('data-theme', targetTheme);
      localStorage.setItem('theme', targetTheme);
      
      var dots = document.querySelectorAll('.theme-dot');
      dots.forEach(function(dot) {
        if (dot.getAttribute('data-set-theme') === targetTheme) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      changeTheme(currentTheme);
    });

    // 1. 顶部阅读进度条
    window.onscroll = function() {
      var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var scrolled = (winScroll / height) * 100;
      var pb = document.getElementById("myProgressBar");
      if(pb) pb.style.width = scrolled + "%";
    };

    // 2. 全站全文搜索数据库构建 (正确 JSON 序列化)
    var globalSearchDB = [
      {% for post in site.posts %}
        {
          title: {{ post.title | jsonify }},
          url: {{ post.url | relative_url | jsonify }},
          date: {{ post.date | date: "%Y-%m-%d" | jsonify }},
          content: {{ post.content | strip_html | newline_to_br | strip_newlines | replace: '<br />', ' ' | jsonify }}
        }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];

function handleGlobalSearch() {
  var input = document.getElementById('global-search-input');
  if (!input) return;
  
  var query = input.value.trim().toLowerCase();
  var overlay = document.getElementById('search-modal-overlay');
  var listContainer = document.getElementById('search-results-list');
  var noResultEl = document.getElementById('search-no-results');

  if (!query) {
    overlay.style.display = 'none';
    return;
  }

  var matches = globalSearchDB.filter(function(post) {
    // 🛡️ 强类型防空安全转换：强制转换为字符串，即使是 null / undefined 也绝不报错
    var safeTitle = String(post.title || '').toLowerCase();
    var safeContent = String(post.content || '').toLowerCase();

    var matchTitle = safeTitle.indexOf(query) !== -1;
    var matchContent = safeContent.indexOf(query) !== -1;
    
    return matchTitle || matchContent;
  });

  overlay.style.display = 'block';

  if (matches.length === 0) {
    listContainer.innerHTML = '';
    noResultEl.style.display = 'block';
  } else {
    noResultEl.style.display = 'none';
    var html = '';
    matches.forEach(function(post, idx) {
      var seq = (idx + 1 < 10 ? '0' : '') + (idx + 1);
      var displayTitle = post.title || '无标题文章';
      var displayUrl = post.url || '#';
      var displayDate = post.date || '';

      html += '<li class="post-item">' +
                '<div class="post-left">' +
                  '<span class="post-index">' + seq + '</span>' +
                  '<a class="post-title" href="' + displayUrl + '">' + displayTitle + '</a>' +
                '</div>' +
                '<span class="post-date">' + displayDate + '</span>' +
              '</li>';
    });
    listContainer.innerHTML = html;
  }
}

    function closeSearchModal(e) {
      if (e.target.id === 'search-modal-overlay') {
        document.getElementById('search-modal-overlay').style.display = 'none';
      }
    }

    function closeSearchModalDirect() {
      document.getElementById('search-modal-overlay').style.display = 'none';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeSearchModalDirect();
    });

    // 3. 代码块一键复制功能注入
    document.addEventListener('DOMContentLoaded', function() {
      var codeBlocks = document.querySelectorAll('pre');

      codeBlocks.forEach(function(pre) {
        if (pre.querySelector('.copy-code-button')) return;

        var btn = document.createElement('button');
        btn.className = 'copy-code-button';
        btn.type = 'button';
        btn.innerText = '复制';

        btn.addEventListener('click', function() {
          var code = pre.querySelector('code');
          var textToCopy = code ? code.innerText : pre.innerText;

          navigator.clipboard.writeText(textToCopy).then(function() {
            btn.innerText = '已复制!';
            btn.classList.add('copied');
            
            setTimeout(function() {
              btn.innerText = '复制';
              btn.classList.remove('copied');
            }, 2000);
          }).catch(function(err) {
            console.error('复制失败: ', err);
            btn.innerText = '失败';
            setTimeout(function() {
              btn.innerText = '复制';
            }, 2000);
          });
        });

        pre.appendChild(btn);
      });
    });

    // 自动化折叠分页：超过 10 页自动添加省略号和最后一页
document.addEventListener('DOMContentLoaded', function() {
  var pagination = document.querySelector('.pagination');
  if (!pagination) return;

  // 获取所有纯页码链接/节点（过滤掉“下一页”、“末页”和跳转控件）
  var allNodes = Array.from(pagination.childNodes);
  var pageLinks = [];
  
  allNodes.forEach(function(node) {
    if (node.tagName === 'A' || node.tagName === 'SPAN') {
      var txt = node.textContent.trim();
      // 判断是否为纯数字页码
      if (/^\d+$/.test(txt)) {
        pageLinks.push({
          num: parseInt(txt, 10),
          element: node
        });
      }
    }
  });

  var totalPages = pageLinks.length;

  // 如果页码总数超过 10 页，进行裁剪
  if (totalPages > 10) {
    var currentPageObj = pageLinks.find(function(item) {
      return item.element.classList.contains('current') || item.element.classList.contains('active');
    });
    var currentPage = currentPageObj ? currentPageObj.num : 1;

    // 当当前页在第 1~10 页范围内时
    if (currentPage <= 10) {
      pageLinks.forEach(function(item) {
        if (item.num > 10 && item.num < totalPages) {
          // 隐藏第 11 页到倒数第二页
          item.element.style.display = 'none';
        }
      });

      // 创建省略号元素
      var ellipsis = document.createElement('span');
      ellipsis.className = 'ellipsis';
      ellipsis.innerText = '...';
      ellipsis.style.padding = '4px 8px';
      ellipsis.style.color = 'var(--muted-color)';

      // 找到第 10 页元素，并在其后面插入省略号
      var page10Item = pageLinks.find(function(item) { return item.num === 10; });
      if (page10Item && page10Item.element.nextSibling) {
        pagination.insertBefore(ellipsis, page10Item.element.nextSibling);
      }
    }
  }
});
  </script>
