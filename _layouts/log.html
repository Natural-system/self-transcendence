---
layout: default
---

<style>
  .log-container {
    max-width: 800px;
    margin: 0 auto;
  }

  /* --- 1. 年份大标题样式 (# 2026 年) --- */
  .log-year-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text-color);
    margin: 40px 0 15px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent-color);
    letter-spacing: 0.5px;
  }
  .log-year-title:first-child {
    margin-top: 10px;
  }

  /* --- 2. 月份中标题样式 (## 08 月) --- */
  .log-month-title {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-color);
    opacity: 0.85;
    margin: 25px 0 12px 0;
    padding-left: 4px;
    border-left: 3px solid var(--muted-color);
    line-height: 1.2;
  }

  /* --- 3. 时间轴容器 --- */
  .log-timeline {
    position: relative;
    padding-left: 18px;
    margin-bottom: 15px;
    border-left: 2px solid var(--border-color);
  }

  /* --- 4. 日志条目容器 --- */
  .log-item {
    position: relative;
    margin-bottom: 24px; /* 条目与条目之间的间距 */
  }

  /* 时间轴悬挂小圆点 */
  .log-item::before {
    content: "";
    position: absolute;
    left: -23px;
    top: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--accent-color);
    border: 2px solid var(--bg-color);
  }

  /* 具体日期标题 */
  .log-item h3 {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted-color);
    margin: 0 0 6px 0;
    padding: 0;
    border: none;
    line-height: 1.3;
  }

  /* 👈 日志正文：段落与空行优化 */
  .log-item p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--text-color);
    margin: 0 0 12px 0; /* 每次按 Enter 空行后，段落之间会有 12px 的舒适留白 */
  }
  .log-item p:last-child {
    margin-bottom: 0;   /* 最后一段底部不留白，避免影响条目间距 */
  }

  /* --- 5. 触底自动加载提示器 --- */
  .log-infinite-scroll-trigger {
    text-align: center;
    padding: 20px 0;
    font-size: 0.85rem;
    font-family: var(--font-mono);
    color: var(--muted-color);
  }

  /* --- 6. 页头字数与阅读时间数据统计面板 --- */
  .log-stats {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--muted-color);
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>

<div class="log-container">
  <header class="article-header">
    <h1 class="article-title">{{ page.title }}</h1>
    <div class="meta-info">
      记录日常随感与碎片思考 · Fun asr nano大模型语音转文字 · 不检查，零碎，错字勿怪 · 倒序排列
    </div>
    <!-- 页头字数与预计阅读时间 -->
    <div class="log-stats">
      <span>全页共 <strong id="log-word-count">-</strong> 字</span>
      <span>·</span>
      <span>预计阅读时间 <strong id="log-read-time">-</strong> 分钟</span>
    </div>
  </header>

  <!-- 渲染后的日志容器 -->
  <div id="rendered-log-wrapper"></div>

  <!-- 触底自动加载触发点 / 状态提示 -->
  <div class="log-infinite-scroll-trigger" id="scroll-trigger" style="display: none;">
    <span id="trigger-text">正在加载更多历史日志...</span>
  </div>

  <!-- 隐藏原始 Markdown HTML 内容供脚本解析 -->
  <div id="raw-log-content" style="display: none;">
    {{ content }}
  </div>

  <!-- Utterances 评论区系统 -->
  <div class="article-comments" style="margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
    <script src="https://utteranc.es/client.js"
            repo="Natural-system/self-transcendence"
            issue-term="pathname"
            theme="github-light"
            crossorigin="anonymous"
            async>
    </script>
  </div>
</div>

<!-- 三级层级解析 + 按文件异步 Fetch 触底无限滚动脚本 -->
<script>
  var allLogGroups = [];
  var currentIndex = 0;
  var BATCH_SIZE = 50;   /* 每次渲染 50 条日志 */
  var isLoading = false;
  
  // 日志文件加载顺序列表（最新在前，最后是 2026 以前）
  // 到了 2027 年，直接改成 ['2027', '2026', 'before-2026']
  var logFiles = ['2026', 'before-2026']; 
  var currentFileIndex = 0;

  document.addEventListener("DOMContentLoaded", function() {
    // 首次载入最新文件的日志
    fetchAndParseLogFile(logFiles[currentFileIndex], function() {
      loadNextBatch();
      setupInfiniteScroll();
    });
  });

  /**
   * 异步请求指定日志 Key 的 JSON 数据并解析
   */
  function fetchAndParseLogFile(fileKey, callback) {
    isLoading = true;
    var triggerText = document.getElementById('trigger-text');
    if (triggerText) {
      triggerText.textContent = fileKey === 'before-2026' ? '正在加载 2026 年以前的历史日志...' : '正在加载 ' + fileKey + ' 年日志...';
    }

    var baseUrl = "{{ site.baseurl }}";
    var logUrl = baseUrl + '/api/logs/' + fileKey + '.json';

    fetch(logUrl)
      .then(function(response) {
        if (!response.ok) throw new Error('网络响应异常');
        return response.json();
      })
      .then(function(data) {
        // 创建临时 DOM 节点解析 HTML 内容
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = data.content || '';

        // 计算字数与阅读时间
        calculateLogStats(tempDiv);

        // 解析节点进入分组数组
        parseNodesToGroups(tempDiv);

        isLoading = false;
        if (callback) callback();
      })
      .catch(function(err) {
        console.error('加载日志失败:', err);
        isLoading = false;
      });
  }

  /**
   * 解析 HTML 节点为三级日志分组
   */
  function parseNodesToGroups(rawEl) {
    var nodes = Array.from(rawEl.children);
    var currentItem = null;

    nodes.forEach(function(node) {
      var tag = node.tagName.toLowerCase();

      if (tag === 'h1') {
        if (currentItem) {
          allLogGroups.push({ type: 'item', node: currentItem });
          currentItem = null;
        }
        allLogGroups.push({ type: 'year', node: node });
      } 
      else if (tag === 'h2') {
        if (currentItem) {
          allLogGroups.push({ type: 'item', node: currentItem });
          currentItem = null;
        }
        allLogGroups.push({ type: 'month', node: node });
      }
      else if (tag === 'h3') {
        if (currentItem) {
          allLogGroups.push({ type: 'item', node: currentItem });
        }
        currentItem = document.createElement('div');
        currentItem.className = 'log-item';
        currentItem.appendChild(node);
      } 
      else if (currentItem) {
        currentItem.appendChild(node);
      }
    });

    if (currentItem) {
      allLogGroups.push({ type: 'item', node: currentItem });
    }
  }

  /**
   * 累加字数与阅读时间
   */
  var totalWordsAccumulated = 0;
  function calculateLogStats(rawEl) {
    var text = rawEl.textContent || rawEl.innerText || '';
    var cjkCount = (text.match(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g) || []).length;
    var englishWordsCount = (text.replace(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g, ' ').match(/\b\w+\b/g) || []).length;

    totalWordsAccumulated += (cjkCount + englishWordsCount);
    var readTime = Math.max(1, Math.ceil(totalWordsAccumulated / 400));

    var wordCountEl = document.getElementById('log-word-count');
    var readTimeEl = document.getElementById('log-read-time');

    if (wordCountEl) wordCountEl.textContent = totalWordsAccumulated.toLocaleString();
    if (readTimeEl) readTimeEl.textContent = readTime;
  }

  function loadNextBatch() {
    if (isLoading) return;
    isLoading = true;

    var wrapper = document.getElementById('rendered-log-wrapper');
    var triggerBox = document.getElementById('scroll-trigger');
    var triggerText = document.getElementById('trigger-text');

    var renderedItemsCount = 0;
    var activeTimeline = wrapper.querySelector('.log-timeline:last-child');

    while (currentIndex < allLogGroups.length && renderedItemsCount < BATCH_SIZE) {
      var group = allLogGroups[currentIndex];

      if (group.type === 'year') {
        var yearDiv = document.createElement('div');
        yearDiv.className = 'log-year-title';
        yearDiv.innerHTML = group.node.innerHTML;
        wrapper.appendChild(yearDiv);
        activeTimeline = null; 
      } 
      else if (group.type === 'month') {
        var monthDiv = document.createElement('div');
        monthDiv.className = 'log-month-title';
        monthDiv.innerHTML = group.node.innerHTML;
        wrapper.appendChild(monthDiv);

        activeTimeline = document.createElement('div');
        activeTimeline.className = 'log-timeline';
        wrapper.appendChild(activeTimeline);
      }
      else if (group.type === 'item') {
        if (!activeTimeline) {
          activeTimeline = document.createElement('div');
          activeTimeline.className = 'log-timeline';
          wrapper.appendChild(activeTimeline);
        }
        activeTimeline.appendChild(group.node);
        renderedItemsCount++;
      }

      currentIndex++;
    }

    var totalItems = allLogGroups.filter(g => g.type === 'item').length;
    var currentRenderedItems = wrapper.querySelectorAll('.log-item').length;

    // 当当前数据包渲染完毕，且还有后续历史文件未请求时，加载下一个文件
    if (currentIndex >= allLogGroups.length && currentFileIndex + 1 < logFiles.length) {
      currentFileIndex++;
      fetchAndParseLogFile(logFiles[currentFileIndex], function() {
        isLoading = false;
        loadNextBatch();
      });
      return;
    }

    if (currentRenderedItems < totalItems || currentFileIndex + 1 < logFiles.length) {
      triggerBox.style.display = 'block';
      triggerText.textContent = '向下滚动加载更多历史日志...';
    } else {
      triggerBox.style.display = 'block';
      triggerText.textContent = '— 已加载全部随想日志 —';
    }

    isLoading = false;
  }

  function setupInfiniteScroll() {
    var triggerEl = document.getElementById('scroll-trigger');
    if (!triggerEl) return;

    var observer = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        loadNextBatch();
      }
    }, {
      rootMargin: '200px'
    });

    observer.observe(triggerEl);
  }
</script>
