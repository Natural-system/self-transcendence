---
layout: default
---

<style>
  .log-container {
    max-width: 800px;
    margin: 0 auto;
  }

  /* --- 1. 年份大标题样式 (# 2026 年) --- */
  .log-year-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text-color);
    margin: 40px 0 15px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent-color);
    letter-spacing: 0.5px;
  }
  .log-year-title:first-child {
    margin-top: 10px;
  }

  /* --- 2. 月份中标题样式 (## 08 月) --- */
  .log-month-title {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-color);
    opacity: 0.85;
    margin: 25px 0 12px 0;
    padding-left: 4px;
    border-left: 3px solid var(--muted-color);
    line-height: 1.2;
  }

  /* --- 3. 时间轴容器 --- */
  .log-timeline {
    position: relative;
    padding-left: 18px;
    margin-bottom: 15px;
    border-left: 2px solid var(--border-color);
  }

  /* --- 4. 紧凑型日志条目 (### 08-14) --- */
  .log-item {
    position: relative;
    margin-bottom: 20px; /* 紧凑条目间距 */
  }

  /* 时间轴悬挂小圆点 */
  .log-item::before {
    content: "";
    position: absolute;
    left: -23px;
    top: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--accent-color);
    border: 2px solid var(--bg-color);
  }

  /* 具体日期标题 */
  .log-item h3 {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted-color);
    margin: 0 0 4px 0;
    padding: 0;
    border: none;
    line-height: 1.3;
  }

  /* 日志正文 */
  .log-item p {
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--text-color);
    margin: 0 0 4px 0;
  }
  .log-item p:last-child {
    margin-bottom: 0;
  }

  /* --- 5. 触底自动加载提示器 --- */
  .log-infinite-scroll-trigger {
    text-align: center;
    padding: 20px 0;
    font-size: 0.85rem;
    font-family: var(--font-mono);
    color: var(--muted-color);
  }
</style>

<div class="log-container">
  <header class="article-header">
    <h1 class="article-title">{{ page.title }}</h1>
    <div class="meta-info">
      记录日常随感与碎片思考 · 倒序排列
    </div>
  </header>

  <!-- 渲染后的日志容器 -->
  <div id="rendered-log-wrapper"></div>

  <!-- 触底自动加载触发点 / 状态提示 -->
  <div class="log-infinite-scroll-trigger" id="scroll-trigger" style="display: none;">
    <span id="trigger-text">正在加载更多历史日志...</span>
  </div>

  <!-- 隐藏原始 Markdown HTML 内容供脚本解析 -->
  <div id="raw-log-content" style="display: none;">
    {{ content }}
  </div>

  <!-- Utterances 评论区系统 -->
  <div class="article-comments" style="margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
    <script src="https://utteranc.es/client.js"
            repo="Natural-system/self-transcendence"
            issue-term="pathname"
            theme="github-light"
            crossorigin="anonymous"
            async>
    </script>
  </div>
</div>

<!-- 三级层级解析 + 滚动触底自动加载脚本 -->
<script>
  var allLogGroups = []; // 存储解析后的所有组
  var currentIndex = 0;
  var BATCH_SIZE = 50;   /* 👈 首次及后续每次加载 50 条日志 */
  var isLoading = false;

  document.addEventListener("DOMContentLoaded", function() {
    var rawEl = document.getElementById('raw-log-content');
    var wrapper = document.getElementById('rendered-log-wrapper');
    if (!rawEl || !wrapper) return;

    var nodes = Array.from(rawEl.children);
    var currentItem = null;

    nodes.forEach(function(node) {
      var tag = node.tagName.toLowerCase();

      // 1. 解析 # 2026 年 为年份大标题
      if (tag === 'h1') {
        if (currentItem) {
          allLogGroups.push({ type: 'item', node: currentItem });
          currentItem = null;
        }
        allLogGroups.push({ type: 'year', node: node });
      } 
      // 2. 解析 ## 08 月 为月份中标题
      else if (tag === 'h2') {
        if (currentItem) {
          allLogGroups.push({ type: 'item', node: currentItem });
          currentItem = null;
        }
        allLogGroups.push({ type: 'month', node: node });
      }
      // 3. 解析 ### 08-14 为具体日志条目
      else if (tag === 'h3') {
        if (currentItem) {
          allLogGroups.push({ type: 'item', node: currentItem });
        }
        currentItem = document.createElement('div');
        currentItem.className = 'log-item';
        currentItem.appendChild(node);
      } 
      else if (currentItem) {
        currentItem.appendChild(node);
      }
    });

    if (currentItem) {
      allLogGroups.push({ type: 'item', node: currentItem });
    }

    // 初始加载前 50 条
    loadNextBatch();

    // 初始化 Intersection Observer 监听滚动触底
    setupInfiniteScroll();
  });

  function loadNextBatch() {
    if (isLoading) return;
    isLoading = true;

    var wrapper = document.getElementById('rendered-log-wrapper');
    var triggerBox = document.getElementById('scroll-trigger');
    var triggerText = document.getElementById('trigger-text');

    var renderedItemsCount = 0;
    var activeTimeline = wrapper.querySelector('.log-timeline:last-child');

    while (currentIndex < allLogGroups.length && renderedItemsCount < BATCH_SIZE) {
      var group = allLogGroups[currentIndex];

      if (group.type === 'year') {
        var yearDiv = document.createElement('div');
        yearDiv.className = 'log-year-title';
        yearDiv.innerHTML = group.node.innerHTML;
        wrapper.appendChild(yearDiv);
        activeTimeline = null; 
      } 
      else if (group.type === 'month') {
        var monthDiv = document.createElement('div');
        monthDiv.className = 'log-month-title';
        monthDiv.innerHTML = group.node.innerHTML;
        wrapper.appendChild(monthDiv);

        activeTimeline = document.createElement('div');
        activeTimeline.className = 'log-timeline';
        wrapper.appendChild(activeTimeline);
      }
      else if (group.type === 'item') {
        if (!activeTimeline) {
          activeTimeline = document.createElement('div');
          activeTimeline.className = 'log-timeline';
          wrapper.appendChild(activeTimeline);
        }
        activeTimeline.appendChild(group.node);
        renderedItemsCount++;
      }

      currentIndex++;
    }

    // 检查剩余条目状态
    var totalItems = allLogGroups.filter(g => g.type === 'item').length;
    var currentRenderedItems = wrapper.querySelectorAll('.log-item').length;
    var remaining = totalItems - currentRenderedItems;

    if (remaining > 0) {
      triggerBox.style.display = 'block';
      triggerText.textContent = '向下滚动加载更多历史日志 (剩余 ' + remaining + ' 条)';
    } else {
      triggerBox.style.display = 'block';
      triggerText.textContent = '— 已加载全部随想日志 —';
    }

    isLoading = false;
  }

  function setupInfiniteScroll() {
    var triggerEl = document.getElementById('scroll-trigger');
    if (!triggerEl) return;

    var observer = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        var totalItems = allLogGroups.filter(g => g.type === 'item').length;
        var wrapper = document.getElementById('rendered-log-wrapper');
        var currentRenderedItems = wrapper ? wrapper.querySelectorAll('.log-item').length : 0;

        // 仅在还有未渲染条目时触发自动加载
        if (currentRenderedItems < totalItems) {
          loadNextBatch();
        }
      }
    }, {
      rootMargin: '200px' /* 提前 200 像素触发，让滚动体验完全丝滑无预感 */
    });

    observer.observe(triggerEl);
  }
</script>
